server.port=8081
spring.application.name=PRODUCT-SERVICE

spring.datasource.url = jdbc:mysql://localhost:3306/naveen
spring.datasource.username=root
spring.datasource.password=Naveen@3116

spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl.auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.hostname=localhost

springdoc.api-docs.path=/v3/api-docs

# Basic Kafka Config
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=product-group
spring.kafka.consumer.auto-offset-reset=earliest

# 1. Use the ErrorHandlingDeserializer to prevent the "Infinite Loop" crash
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# 2. Tell Kafka exactly which class to use for the incoming JSON
# Replace 'com.naveen.productservice.event.OrderPlacedEvent' with your actual package/class
spring.kafka.consumer.properties.spring.json.value.default.type=com.naveen.productservice.entity.dto.OrderPlacedEvent

# 3. Security: Trust all packages
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# 4. Ignore headers coming from the Producer (crucial since they differ by package)
spring.kafka.consumer.properties.spring.json.use.type.headers=false