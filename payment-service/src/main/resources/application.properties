# Server Configuration
server.port=8083
spring.application.name=PAYMENT-SERVICE

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Naveen@3116
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl.auto=update

# Eureka & Docs
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
springdoc.api-docs.path=/v3/api-docs

# Kafka Common Configuration
spring.kafka.bootstrap-servers=localhost:9092

# --- KAFKA CONSUMER (FIXED) ---
spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Use ErrorHandlingDeserializer to catch and log serialization errors instead of crashing
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Trusted Packages
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# TYPE MAPPING: Maps the sender's class path to your local class path
# Format: sender.package.Class:receiver.package.Class
spring.kafka.consumer.properties.spring.json.type.mapping=com.naveen.orderservice.dto.OrderReadyForPaymentEvent:com.naveen.payment_service.dto.OrderReadyForPaymentEvent

# --- KAFKA PRODUCER ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer